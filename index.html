<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל חנות Aurora Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- ספריית Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>מנהל רשימה לבנה וקטלוג</h1>
            <p>חפש אפליקציות, גרור אותן בין קטגוריות ונהל את החנות שלך בקלות</p>
        </header>

        <!-- חלק 1: חיפוש והוספה -->
        <section class="card search-section">
            <h2><span class="step-num">1</span> הוספת אפליקציה חדשה</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="הקלד שם אפליקציה או מזהה חבילה (למשל: WhatsApp / com.waze)...">
                <button id="search-btn">חפש</button>
            </div>
            <div id="search-results" class="search-results"></div>
        </section>

        <!-- חלק 2: לוח הקטגוריות והבלוקים הצפים -->
        <section class="card board-section">
            <div class="board-header">
                <h2><span class="step-num">2</span> סידור קטגוריות ואפליקציות (גרור לשינוי מיקום)</h2>
                <button id="add-cat-btn" class="btn-secondary">+ קטגוריה חדשה</button>
            </div>
            
            <div id="categories-board" class="categories-board">
                <!-- הקטגוריות ייטענו לכאן אוטומטית כבלוקים צפים -->
            </div>
        </section>

        <!-- חלק 3: שמירה -->
        <section class="card actions-section">
            <div class="status-msg" id="status-msg"></div>
            <div class="action-buttons">
                <button id="save-btn" class="btn-primary">שמור שינויים ל-GitHub</button>
                <button id="logout-btn" class="btn-danger">התנתק</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
